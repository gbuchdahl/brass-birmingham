schema_version: 1

provenance:
  confidence: high
  detail: >-
    The rulebook defines income movement, loans, the level -10 floor, the
    level 30 ceiling, and end-of-round settlement. The board reference is the
    authority for the 101 printed Progress Track spaces and their widening
    income-level bands. RulesPal independently cross-checks the rule text and
    explicitly identifies setup space 10 as income level 0.
  sources:
    - id: official-rulebook
      role: primary-rules
      url: https://cdn.shopify.com/s/files/1/0246/2190/8043/files/Brass-Birmingham-Rulebook.pdf?v=1741712309
      claims:
        - setup marker space
        - advance spaces and level 30 ceiling
        - loan movement and level -10 floor
        - end-of-round income and shortfall resolution
    - id: board-reference
      role: primary-component-image
      url: https://boardgamegeek.com/image/3733951/brass-birmingham
      claims:
        - printed Progress Track spaces 0 through 100
        - printed income-level band boundaries
    - id: rulespal-rulebook
      role: independent-rules-transcription
      url: https://www.rulespal.com/brass-birmingham/rulebook
      claims:
        - setup space 10 represents income level 0
        - loan target is the highest space in the lower level
        - final-round income exception and shortfall resolution

track:
  first_space: 0
  last_space: 100
  starting_space: 10
  minimum_income_level: -10
  maximum_income_level: 30
  bands:
