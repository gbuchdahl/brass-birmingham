rules:
  advance:
    unit: spaces
    ceiling_income_level: 30
  loan:
    money_received: 30
    income_levels_back: 3
    minimum_target_income_level: -10
    target_space: highest-space-in-target-level
  end_of_round:
    skip_on_final_round_of_game: true
    negative_income_tile_value: half-build-cost-rounded-down
    tile_removal_stop: as-soon-as-shortfall-is-covered
    remaining_shortfall_vp_loss_per_pound: 1
