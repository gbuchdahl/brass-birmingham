  Leek:
    map_zone: north
    # TODO(image-only inference): verify Leek slot labels.
    industries: [[Cotton], [Manufactured]]
  Belper:
    map_zone: northeast
    # TODO(image-only inference): verify Belper slot labels.
    # TODO(image-only inference): Belper may contain one dual-use space.
    industries: [[Cotton], [Manufactured, Iron], [Pottery]]

