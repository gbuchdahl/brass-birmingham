    # TODO(image-only inference): verify if one of these spaces is a dual-use slot.
    industries: [[Cotton], [Manufactured], [Pottery], [Iron, Coal]]
  Stone:
    map_zone: north
    # TODO(image-only inference): stone's second slot may be Iron/Manufactured depending icon mapping.
